# Lab Horizon — front React + back Laravel + MySQL + Redis (+ LM Studio optionnel)
# Site : https://localhost:8443 (http://localhost:8080 redirige). Certificat auto-signé par défaut.
# Stack back reprise du Docker.zip (php-fpm/nginx, MySQL 8.4, Redis 7).
#
# Déploiement (procédure complète : docs/passation/02-lancer-et-relancer.md) :
#   1. sh scripts/deploy/init-env.sh   (Windows : scripts\deploy\init-env.ps1) → crée .env
#   2. docker compose up -d --build
#
# LM Studio (image lourde, ~plusieurs Go) — profil optionnel :
#   docker compose --profile llm up -d lm-studio
# Puis relier au réseau si conteneur externe, cf. .env.docker.example (LLM_URL).
#
# lm-studio : image bureau distant (noVNC, port 3001) — modeles geres a la
# main via l'UI ou `docker compose exec lm-studio lms ...`. L'appli LM Studio
# ne se relance pas seule au demarrage du conteneur (pas de hook autostart
# dans l'image) : le healthcheck relance le serveur `lms` ET recharge
# LMSTUDIO_MODEL si besoin (le modele doit deja avoir ete telecharge une fois
# via `docker compose exec lm-studio lms get <model>` ou l'UI — `lms load`
# ne fait que charger un modele deja present sur le volume lmstudio-config).

# Nom fixe : volumes et conteneurs identiques quel que soit le dossier du clone
# (labhorizon_lh-mysql-data, labhorizon_frontend-certs…).
name: labhorizon

# Journaux Docker limités à 3 × 10 Mo par service : sans limite, ils remplissent le disque.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  lm-studio:
    profiles: ["llm"]
    # Version épinglée (reproductible) ; Dependabot propose les mises à jour.
    image: linuxserver/lm-studio:2026-10-16-ls41
    container_name: lm-studio
    restart: unless-stopped
    logging: *logging
    environment:
      TITLE: LM Studio
      # Même valeur que LLM_MODEL côté backend (chargé par le healthcheck).
      LMSTUDIO_MODEL: ${LLM_MODEL:-mistral-7b-instruct-v0.3}
    volumes:
      - lmstudio-config:/config
    ports:
      # Joignables depuis cette machine seulement : l'API et le bureau n'ont pas d'authentification.
      - "127.0.0.1:3001:3000" # UI (noVNC, http) — http://localhost:3001
      - "127.0.0.1:3000:3001" # UI (noVNC, https)
      - "127.0.0.1:1234:1234" # API LM Studio (OpenAI-compatible) — http://localhost:1234
    healthcheck:
      # Le conteneur ne relance pas l'appli LM Studio tout seul au boot :
      # si le serveur/modele n'est pas pret, on (re)demarre le serveur et on
      # charge LMSTUDIO_MODEL via `lms`. Idempotent : ne fait rien si le
      # modele demande apparait deja dans /v1/models.
      test:
        - CMD-SHELL
        - >-
          curl -sf http://127.0.0.1:1234/v1/models | grep -q "$$LMSTUDIO_MODEL" ||
          (lms server start --port 1234 --bind 0.0.0.0 --cors;
          lms load "$$LMSTUDIO_MODEL" --yes;
          sleep 2 && curl -sf http://127.0.0.1:1234/v1/models | grep -q "$$LMSTUDIO_MODEL")
      interval: 15s
      timeout: 90s
      retries: 20
      start_period: 60s
    networks:
      - labhorizon

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_DATA_SOURCE: rest
        # API appelée sur l'adresse de la page : l'image ne dépend pas d'APP_URL.
        VITE_API_BASE_URL: same-origin
    container_name: labhorizon-frontend
    restart: unless-stopped
    logging: *logging
    environment:
      # Port HTTPS vu par le navigateur (redirection HTTP → HTTPS). 443 sur un serveur.
      HTTPS_PORT: ${HTTPS_PORT:-8443}
      # 31536000 seulement avec un vrai certificat (HSTS épingle le nom de domaine).
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-0}
      # Noms/IP ajoutés au certificat auto-signé, ex. IP:192.168.1.20,DNS:labhorizon.local
      TLS_SAN: ${TLS_SAN:-}
    ports:
      - "${HTTP_PORT:-8080}:8080"
      - "${HTTPS_PORT:-8443}:8443"
    volumes:
      # Certificat : auto-signé conservé ici, ou remplacé par tls.crt + tls.key du serveur.
      - frontend-certs:/etc/nginx/certs
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - labhorizon

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: labhorizon-backend
    restart: unless-stopped
    logging: *logging
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      # Obligatoire et stable : vide, l'entrypoint en générerait une nouvelle à chaque
      # démarrage et tous les utilisateurs seraient déconnectés.
      APP_KEY: ${APP_KEY:?APP_KEY manquant dans .env — lancer scripts/deploy/init-env}
      APP_URL: ${APP_URL:-https://localhost:8443}
      APP_TIMEZONE: Pacific/Noumea
      APP_LOCALE: fr

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE manquant dans .env}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME manquant dans .env}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env — lancer scripts/deploy/init-env}
      APP_BOOT_PASSWORD: ${APP_BOOT_PASSWORD:?APP_BOOT_PASSWORD manquant dans .env — lancer scripts/deploy/init-env}

      SESSION_DRIVER: database
      # Cookies de session envoyés uniquement en HTTPS. false seulement pour un back sans TLS en dev.
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      QUEUE_CONNECTION: redis
      CACHE_STORE: database

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      PDF_QUEUE_NAME: ${PDF_QUEUE_NAME:-pdf-processing}
      # Doit dépasser le timeout du job de vulgarisation (300 s), sinon Redis
      # redistribue le job pendant qu'il tourne → MaxAttemptsExceededException.
      REDIS_QUEUE_RETRY_AFTER: ${REDIS_QUEUE_RETRY_AFTER:-330}

      # Service IA (LM Studio, API OpenAI-compatible). Entre conteneurs on passe
      # par le nom du service Compose "lm-studio", jamais par localhost.
      # Valeurs surchargées par le .env racine (LLM_URL / LLM_MODEL / LLM_ENABLED).
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_URL: ${LLM_URL:-http://lm-studio:1234/v1}
      LLM_MODEL: ${LLM_MODEL:-mistral-7b-instruct-v0.3}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-240}

      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:8443,127.0.0.1:8443,localhost:5173,127.0.0.1:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost:8443,https://127.0.0.1:8443,http://localhost:5173,http://127.0.0.1:5173}

      LOG_CHANNEL: stderr
      # info : trace les étapes de la vulgarisation IA (requête, durée, sauvegarde).
      LOG_LEVEL: ${LOG_LEVEL:-info}

      RUN_MIGRATIONS: "true"
      RUN_SEED: "true"
    volumes:
      - storage-data:/var/www/html/storage/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 50s
    networks:
      - labhorizon

  redis:
    image: redis:7-alpine
    container_name: labhorizon-redis
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - labhorizon

  mysql:
    image: mysql:8.4
    container_name: labhorizon-mysql
    restart: unless-stopped
    logging: *logging
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE manquant dans .env}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME manquant dans .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env — lancer scripts/deploy/init-env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD manquant dans .env — lancer scripts/deploy/init-env}
    volumes:
      - lh-mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306" # joignable seulement depuis cette machine ; 3306 hôte déjà pris par un MySQL natif
    healthcheck:
      # 127.0.0.1 force le TCP : le serveur accepte réellement les connexions réseau.
      # Mot de passe lu dans l'environnement du conteneur (MYSQL_PWD), pas écrit dans la
      # commande : il n'apparaît pas dans docker inspect.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - labhorizon

volumes:
  frontend-certs:
  lh-mysql-data:
  redis-data:
  storage-data:
  lmstudio-config:

networks:
  labhorizon:
    driver: bridge
