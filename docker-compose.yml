# Lab Horizon — front React + back Laravel + MySQL + Redis + LM Studio
# Stack back reprise du Docker.zip (php-fpm/nginx, MySQL 8.4, Redis 7).
# Usage : copier .env.docker.example vers .env, renseigner APP_KEY, puis
#   docker compose up --build
#
# lm-studio : image bureau distant (noVNC, port 3001) — modeles geres a la
# main via l'UI ou `docker compose exec lm-studio lms ...`. L'appli LM Studio
# ne se relance pas seule au demarrage du conteneur (pas de hook autostart
# dans l'image) : le healthcheck relance le serveur `lms` ET recharge
# LMSTUDIO_MODEL si besoin (le modele doit deja avoir ete telecharge une fois
# via `docker compose exec lm-studio lms get <model>` ou l'UI — `lms load`
# ne fait que charger un modele deja present sur le volume lmstudio-config).

services:
  lm-studio:
    image: linuxserver/lm-studio:latest
    container_name: lm-studio
    restart: unless-stopped
    environment:
      TITLE: LM Studio
      # Même valeur que LLM_MODEL côté backend (chargé par le healthcheck).
      LMSTUDIO_MODEL: ${LLM_MODEL:-mistral-7b-instruct-v0.3}
    volumes:
      - lmstudio-config:/config
    ports:
      - "3001:3000" # UI (noVNC, http) — http://localhost:3001
      - "3000:3001" # UI (noVNC, https)
      - "1234:1234" # API LM Studio (OpenAI-compatible) — http://localhost:1234
    healthcheck:
      # Le conteneur ne relance pas l'appli LM Studio tout seul au boot :
      # si le serveur/modele n'est pas pret, on (re)demarre le serveur et on
      # charge LMSTUDIO_MODEL via `lms`. Idempotent : ne fait rien si le
      # modele demande apparait deja dans /v1/models.
      test:
        - CMD-SHELL
        - >-
          curl -sf http://127.0.0.1:1234/v1/models | grep -q "$$LMSTUDIO_MODEL" ||
          (lms server start --port 1234 --bind 0.0.0.0 --cors;
          lms load "$$LMSTUDIO_MODEL" --yes;
          sleep 2 && curl -sf http://127.0.0.1:1234/v1/models | grep -q "$$LMSTUDIO_MODEL")
      interval: 15s
      timeout: 90s
      retries: 20
      start_period: 60s
    networks:
      - labhorizon

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_DATA_SOURCE: rest
        VITE_API_BASE_URL: ${APP_URL:-http://localhost:8080}
    container_name: labhorizon-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - labhorizon

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: labhorizon-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "8081:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_TIMEZONE: Pacific/Noumea
      APP_LOCALE: fr

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-labhorizon}
      DB_USERNAME: ${DB_USERNAME:-labhorizon}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}

      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "false"
      QUEUE_CONNECTION: redis
      CACHE_STORE: database

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      PDF_QUEUE_NAME: ${PDF_QUEUE_NAME:-pdf-processing}
      # Doit dépasser le timeout du job de vulgarisation (300 s), sinon Redis
      # redistribue le job pendant qu'il tourne → MaxAttemptsExceededException.
      REDIS_QUEUE_RETRY_AFTER: ${REDIS_QUEUE_RETRY_AFTER:-330}

      # Service IA (LM Studio, API OpenAI-compatible). Entre conteneurs on passe
      # par le nom du service Compose "lm-studio", jamais par localhost.
      # Valeurs surchargées par le .env racine (LLM_URL / LLM_MODEL / LLM_ENABLED).
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_URL: ${LLM_URL:-http://lm-studio:1234/v1}
      LLM_MODEL: ${LLM_MODEL:-mistral-7b-instruct-v0.3}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-240}

      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:8080,127.0.0.1:8080,localhost:5173,127.0.0.1:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173}

      LOG_CHANNEL: stderr
      # info : trace les étapes de la vulgarisation IA (requête, durée, sauvegarde).
      LOG_LEVEL: ${LOG_LEVEL:-info}

      RUN_MIGRATIONS: "true"
      RUN_SEED: "true"
    volumes:
      - storage-data:/var/www/html/storage/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      lm-studio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 50s
    networks:
      - labhorizon

  redis:
    image: redis:7-alpine
    container_name: labhorizon-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - labhorizon

  mysql:
    image: mysql:8.4
    container_name: labhorizon-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-labhorizon}
      MYSQL_USER: ${DB_USERNAME:-labhorizon}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me-root}
    volumes:
      - lh-mysql-data:/var/lib/mysql
    ports:
      - "3307:3306" # 3306 hôte déjà pris par un MySQL natif (mysqld.exe local) — le réseau interne Docker reste sur 3306
    healthcheck:
      # 127.0.0.1 force le TCP (pas le socket Unix) : mysqladmin ping via socket
      # peut renvoyer 0 même si le mot de passe est faux.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-change-me-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - labhorizon

volumes:
  lh-mysql-data:
  redis-data:
  storage-data:
  lmstudio-config:

networks:
  labhorizon:
    driver: bridge
