# Dependabot — PR automatiques de mise à jour, chacune validée par la CI avant merge.
# Les alertes de sécurité (Dependabot security updates) ouvrent en plus des PR immédiates
# sur main, indépendamment de ce planning.
# Doc : docs/TESTING.md
version: 2

updates:
  - package-ecosystem: npm
    directories: ["/", "/frontend", "/backend"]
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Pacific/Noumea
    # Délai avant de proposer une version toute neuve (paquets compromis retirés entre-temps).
    cooldown:
      default-days: 7
    groups:
      npm-mineures:
        update-types: [minor, patch]

  - package-ecosystem: composer
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Pacific/Noumea
    cooldown:
      default-days: 7
    groups:
      composer-mineures:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Pacific/Noumea

  - package-ecosystem: docker
    directories: ["/frontend", "/backend"]
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Pacific/Noumea

  - package-ecosystem: docker-compose
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Pacific/Noumea
