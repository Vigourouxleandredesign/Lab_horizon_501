# =============================================================================
# CI/CD Lab Horizon — rejoue sur une machine propre ce que le hook pre-commit
# (lefthook.yml) vérifie, plus les contrôles sécurité avant prod.
# Obligatoire pour merger sur main (branch protection) : main = prod.
# Doc : docs/TESTING.md
#
# Actions et images épinglées par SHA / digest (attaques supply-chain sur les tags).
# Dependabot (.github/dependabot.yml) propose leurs mises à jour.
# =============================================================================
name: CI

on:
  push:
    branches: [main, develop, env-prod]
  pull_request:
  schedule:
    # Chaque nuit (05:00 Nouméa) : de nouvelles CVE sortent même sans nouveau commit.
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.2" # = image de prod (backend/Dockerfile)
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

jobs:
  # ---------------------------------------------------------------------------
  frontend:
    name: Front — qualité & tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: A — format (Prettier)
        run: npm run format:check
      - name: A — lint (ESLint, 0 warning)
        run: npm run lint
      - name: A — typecheck
        run: npm run typecheck
      - name: A — couleurs (tokens CSS)
        run: npm run check:colors
      - name: C1 — contrat domaines
        run: node ../scripts/check-domain-contract.mjs
      - name: B — tests unitaires
        run: npm run test
      - name: A — build de production
        run: npm run build

  # ---------------------------------------------------------------------------
  backend:
    name: Back — tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_sqlite, sqlite3, intl, gd, zip, bcmath
          coverage: none
          tools: composer:v2
      - name: Cache Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir --working-dir=backend)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - name: composer install
        run: composer install --working-dir=backend --no-interaction --no-progress --prefer-dist
      - name: C3 — PHPUnit (assets Blade construits + .env, comme en prod)
        run: node scripts/ci/backend-test.mjs

  # ---------------------------------------------------------------------------
  security:
    name: Sécurité — secrets & dépendances
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scanne tout l'historique
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2
      - run: npm ci --no-audit --no-fund
      - name: A3 — le scanner de secrets détecte bien (auto-test)
        run: npm run test:secrets
      - name: A3 — aucun secret ni fichier sensible versionné
        run: npm run check:secrets
      - name: A3 — gitleaks (tout l'historique Git)
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" "$GITLEAKS_IMAGE"
          git /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1
      - name: A5 — audit dépendances (npm front + back, Composer) — toute sévérité
        run: node scripts/ci/audit.mjs
      - name: A6 — configuration de la CI elle-même (actionlint + shellcheck)
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo "$ACTIONLINT_IMAGE" -color

  # ---------------------------------------------------------------------------
  dependency-review:
    name: Dépendances — revue de PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low

  # ---------------------------------------------------------------------------
  docker:
    name: Docker — images, config & smoke prod
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Le compose refuse de démarrer sans secrets (modèle .env non rempli)
        run: |
          cp .env.docker.example .env
          if docker compose config --quiet 2>/dev/null; then
            echo "docker compose accepte un .env sans APP_KEY ni mots de passe"; exit 1
          fi
          rm .env

      - name: .env créé par scripts/deploy/init-env.sh (procédure DSI, secrets jetables)
        # Sortie masquée : le script affiche le mot de passe du compte de démo.
        run: sh scripts/deploy/init-env.sh https://127.0.0.1:8443 > /dev/null

      - name: Config — Dockerfiles (Trivy, toute sévérité)
        run: >-
          docker run --rm -v "$PWD:/src:ro" "$TRIVY_IMAGE"
          config --exit-code 1 --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL /src

      - name: Build des images de prod
        run: docker compose build frontend backend

      - name: Front — aucune adresse figée dans le JavaScript (image valable à toute adresse)
        run: >-
          docker run --rm --entrypoint sh labhorizon-frontend -c
          '! grep -lE "https?://(localhost|127[.]0[.]0[.]1):[0-9]" /usr/share/nginx/html/assets/*.js'

      - name: Vulnérabilités des images (Trivy) — bloquant si un correctif existe
        run: |
          for img in labhorizon-backend labhorizon-frontend; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache "$TRIVY_IMAGE" \
              image --exit-code 1 --ignore-unfixed --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL "$img"
          done

      - name: Vulnérabilités sans correctif amont (rapport, non bloquant)
        run: |
          for img in labhorizon-backend labhorizon-frontend; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache "$TRIVY_IMAGE" \
              image --exit-code 0 --severity HIGH,CRITICAL "$img"
          done

      - name: Démarrage de la stack de prod (healthchecks)
        run: docker compose up -d --wait --wait-timeout 300 frontend backend mysql redis

      - name: Journaux Docker limités (pas de disque plein sur la durée)
        run: |
          for c in labhorizon-frontend labhorizon-backend labhorizon-mysql labhorizon-redis; do
            test "$(docker inspect -f '{{index .HostConfig.LogConfig.Config "max-size"}}' "$c")" = "10m"
          done

      - name: Conteneurs sans root
        run: |
          for c in labhorizon-frontend labhorizon-backend; do
            uid=$(docker exec "$c" id -u)
            echo "$c uid=$uid"
            test "$uid" != "0"
          done

      - name: Certificat TLS du front (auto-signé, vérifié ensuite — jamais curl -k)
        run: docker compose cp frontend:/etc/nginx/certs/tls.crt "$RUNNER_TEMP/tls.crt"

      - name: Smoke — HTTPS via le front (redirection, TLS, en-têtes, site, santé, API)
        run: |
          ca=(--cacert "$RUNNER_TEMP/tls.crt")
          redirect=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "http://127.0.0.1:8080/recherche?q=x")
          echo "HTTP → $redirect"
          test "$redirect" = "301 https://127.0.0.1:8443/recherche?q=x"
          if curl -s "${ca[@]}" --tls-max 1.1 -o /dev/null https://127.0.0.1:8443/; then
            echo "TLS 1.1 accepté"; exit 1
          fi
          curl -fsS "${ca[@]}" -D - -o /dev/null https://127.0.0.1:8443/ | grep -qi '^strict-transport-security:'
          curl -fsS "${ca[@]}" -o /dev/null https://127.0.0.1:8443/
          curl -fsS "${ca[@]}" -o /dev/null https://127.0.0.1:8443/up
          curl -fsS "${ca[@]}" -o /dev/null "https://127.0.0.1:8443/api/recherches?page=1&pageSize=1"

      - name: Cookies de session — Secure et HttpOnly
        run: |
          cookies=$(curl -fsS --cacert "$RUNNER_TEMP/tls.crt" -D - -o /dev/null https://127.0.0.1:8443/sanctum/csrf-cookie | grep -i '^set-cookie:' || true)
          echo "$cookies" | sed -E 's/=[^;]+;/=…;/'
          test -n "$cookies"
          if echo "$cookies" | grep -vqi '; *secure'; then echo "cookie sans Secure"; exit 1; fi
          echo "$cookies" | grep -i 'session' | grep -qi '; *httponly'

      - name: C2 — smoke API recherche + auth à travers HTTPS (gate:full)
        env:
          API_BASE_URL: https://127.0.0.1:8443
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/tls.crt
        run: |
          node frontend/scripts/test-search-api.mjs
          node frontend/scripts/test-auth-api.mjs

      - name: Sessions conservées après redémarrage du back (APP_KEY stable)
        env:
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/tls.crt
        run: |
          node scripts/ci/smoke-session.mjs register https://127.0.0.1:8443 "$RUNNER_TEMP/session.json"
          docker compose restart backend
          docker compose up -d --wait --wait-timeout 300 backend
          node scripts/ci/smoke-session.mjs check https://127.0.0.1:8443 "$RUNNER_TEMP/session.json"

      - name: Sauvegarde puis restauration (scripts/deploy/backup.sh + restore.sh)
        run: |
          count() {
            docker compose exec -T mysql bash -c 'MYSQL_PWD=$MYSQL_ROOT_PASSWORD mysql -u root -N -e "select count(*) from recherches" $MYSQL_DATABASE'
          }
          before=$(count)
          sh scripts/deploy/backup.sh
          # Noms horodatés (AAAAMMJJ-HHMMSS) : l'ordre alphabétique est l'ordre chronologique.
          archive=$(find backups -name 'labhorizon-*.tar.gz' | sort | tail -n 1)
          docker compose exec -T mysql bash -c 'MYSQL_PWD=$MYSQL_ROOT_PASSWORD mysql -u root -e "delete from recherches order by id desc limit 3" $MYSQL_DATABASE'
          test "$(count)" -lt "$before"
          sh scripts/deploy/restore.sh "$archive" --yes
          test "$(count)" = "$before"
          curl -fsS --cacert "$RUNNER_TEMP/tls.crt" -o /dev/null "https://127.0.0.1:8443/api/recherches?page=1&pageSize=1"

      - name: Journaux des conteneurs (en cas d'échec)
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Arrêt
        if: always()
        run: docker compose down -v
