[global]
; Le fichier d'origine de l'image ouvre /proc/self/fd/2, refusé si le maître
; PHP-FPM n'est pas root. Le journal va dans storage, propriété de www-data.
error_log = /var/www/html/storage/logs/php-fpm.log
log_limit = 8192

[www]
access.log = /var/www/html/storage/logs/php-fpm.access.log
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
listen = 9000
