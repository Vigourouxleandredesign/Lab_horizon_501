# Config Netlify portable — versionnée pour GitHub et déploiements reproductibles.
# (Le dossier .netlify/ généré par le CLI reste ignoré par Git.)

[build]
  command = "npm run build"
  publish = "dist"

# React Router — routes client (/recherche, /publications/:id, etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
